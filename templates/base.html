{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}КонсультПлан{% endblock %} — КонсультПлан</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    {% include "includes/navigation.html" %}
    <main class="container flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
    <footer class="site-footer text-muted small py-4 mt-4">
        <div class="container">
            Сервис планирования консультационных часов &copy; {% now "Y" %}
        </div>
    </footer>
    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
