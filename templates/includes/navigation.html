{% load static %}
{% with url_name=request.resolver_match.url_name namespace=request.resolver_match.namespace %}
<nav class="navbar navbar-expand-md navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2"
           href="{% url 'homepage:index' %}">
            <img src="{% static 'homepage/img/logo.png' %}" alt="Логотип"
                 width="32" height="32">
            КонсультПлан
        </a>
        <div class="navbar-nav">
            <a class="nav-link {% if namespace == 'homepage' %}active{% endif %}"
               href="{% url 'homepage:index' %}">Главная</a>
            <a class="nav-link {% if namespace == 'teachers' %}active{% endif %}"
               href="{% url 'teachers:list' %}">Преподаватели</a>
            <a class="nav-link {% if namespace == 'appointments' %}active{% endif %}"
               href="{% url 'appointments:list' %}">Записи</a>
        </div>
    </div>
</nav>
{% endwith %}
